[package]
name = "envhive-toolkit"
version = "0.1.0"
description = "蜂巢 EnvHive 工具与插件域：Tool trait / Lua 插件 / 下载安装 / 镜像源 / 加速镜像"
edition = "2021"

[dependencies]
envhive-core = { path = "../envhive-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
mlua = { version = "0.10", features = ["vendored", "lua54", "serialize", "send"] }
dirs = "5"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Storage_FileSystem",
] }
