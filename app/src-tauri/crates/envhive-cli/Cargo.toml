[package]
name = "envhive-cli"
version = "0.1.0"
description = "蜂巢 EnvHive CLI：项目配置生成与终端环境注入"
edition = "2021"

[[bin]]
name = "envhive-cli"
path = "src/main.rs"

[dependencies]
envhive-core = { path = "../envhive-core" }
envhive-toolkit = { path = "../envhive-toolkit" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
